name: Release

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: mybuilds-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/spicyhek/mybuilds
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::Files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # The job and step names below are what the mybuilds service map expects
  # (plan section 8.1). A bump-gitops job is added together with the
  # homelab-infra/k8s/apps/mybuilds manifests.
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      release_id: ${{ steps.release.outputs.id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release ID
        id: release
        run: echo "id=mybuilds/${GITHUB_SHA::7}/production/${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mybuilds:smoke
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}

      - name: Smoke test
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail

          docker run --detach --name smoke \
            --publish 127.0.0.1:8080:8080 \
            --env RELEASE_ID="${RELEASE_ID}" \
            --env MYBUILDS_FIXTURES=true \
            mybuilds:smoke

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            --dump-header headers.txt --output /dev/null \
            http://127.0.0.1:8080/healthz

          tr -d '\r' < headers.txt > headers.clean
          grep -iqxF "x-release-id: ${RELEASE_ID}" headers.clean
          grep -iqxF "cache-control: no-store" headers.clean

          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/releases \
            | jq --exit-status '.releases | length > 0' > /dev/null
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/

          docker logs smoke
          docker rm --force smoke

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}

      - name: Resolve digest
        id: digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: ${DIGEST}"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          {
            echo "### mybuilds image published"
            echo "Release: \`${{ steps.release.outputs.id }}\`"
            echo "Image: \`${IMAGE_NAME}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
