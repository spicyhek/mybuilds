<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mybuilds</title>
<meta name="description" content="mybuilds front page demo (fixture mode): live and replayed releases from commit to verified public release.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6821f'/%3E%3Cpath d='M7 16h18' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='16' r='3.2' fill='white'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3Ccircle cx='23' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('mybuilds-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f3f3f4;
    --border: #e4e4e7;
    --border-strong: #d1d1d6;
    --text: #1d1d1f;
    --muted: #5c5f66;
    --subtle: #8a8d94;
    --link: #0051c3;
    --accent: #f6821f;
    --dot: #dcdce0;
    --ok: #1a7f37;     --ok-bg: #e8f5ec;
    --fail: #cf222e;   --fail-bg: #fdecee;
    --warn: #9a5b00;   --warn-bg: #fff3dc;
    --run: #0a5bd3;    --run-bg: #e8f0fe;
    --unk: #6b7280;    --unk-bg: #f1f2f4;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
    --toast-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0e10; --surface: #18181b; --surface-2: #1f1f23; --border: #2b2b30; --border-strong: #3a3a40;
      --text: #ececef; --muted: #a1a1aa; --subtle: #71717a; --link: #5aa2ff; --dot: #2a2a2f;
      --ok: #3fb950; --ok-bg: rgba(63,185,80,.13); --fail: #f85149; --fail-bg: rgba(248,81,73,.13);
      --warn: #d29922; --warn-bg: rgba(210,153,34,.14); --run: #58a6ff; --run-bg: rgba(88,166,255,.13);
      --unk: #9ca3af; --unk-bg: rgba(156,163,175,.11);
      --shadow: 0 1px 2px rgba(0,0,0,.4); --toast-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0e10; --surface: #18181b; --surface-2: #1f1f23; --border: #2b2b30; --border-strong: #3a3a40;
    --text: #ececef; --muted: #a1a1aa; --subtle: #71717a; --link: #5aa2ff; --dot: #2a2a2f;
    --ok: #3fb950; --ok-bg: rgba(63,185,80,.13); --fail: #f85149; --fail-bg: rgba(248,81,73,.13);
    --warn: #d29922; --warn-bg: rgba(210,153,34,.14); --run: #58a6ff; --run-bg: rgba(88,166,255,.13);
    --unk: #9ca3af; --unk-bg: rgba(156,163,175,.11);
    --shadow: 0 1px 2px rgba(0,0,0,.4); --toast-shadow: 0 10px 30px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  a { color: var(--link); text-underline-offset: 2px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; align-items: center; gap: 10px; font-size: 15px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .crumb-sep { color: var(--subtle); }
  .crumb-cur { font-weight: 600; white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 14px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; }
  .fixture { font-size: 12px; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .top-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 13px; }
  .top-link:hover { color: var(--link); }
  .seg-ctl { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface-2); }
  .seg-ctl button { border: 0; background: none; padding: 4px 7px; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; font-size: 12.5px; font-weight: 500; }
  .seg-ctl button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* ---------- tabs ---------- */
  .tabbar { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
  .tabs button { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--text); box-shadow: var(--shadow); }

  /* ---------- layout ---------- */
  main { padding: 20px 16px 56px; max-width: 1440px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  [hidden] { display: none !important; }

  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--muted); font-weight: 500; min-height: 46px; flex-wrap: wrap; }
  .card-head .spacer { flex: 1; }
  .card-body { background: var(--surface); border-top: 1px solid var(--border); }
  .view-all { color: var(--text); font-size: 13px; background: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
  .view-all:hover { color: var(--link); }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); }
  .tile { padding: 14px 16px; border-left: 1px solid var(--border); min-width: 0; }
  .tile:first-child { border-left: 0; }
  .tile .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -.01em; }
  .tile .sub { color: var(--subtle); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .side { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .side h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .field { margin-top: 14px; }
  .field .k { font-size: 13px; color: var(--muted); }
  .field .v { margin-top: 3px; display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; font-weight: 500; }
  .await { color: var(--subtle); font-weight: 400; font-style: italic; }
  .copy { border: 0; background: none; color: var(--subtle); cursor: pointer; padding: 2px; border-radius: 4px; display: grid; place-items: center; flex: none; }
  .copy:hover { color: var(--text); background: var(--surface-2); }

  /* ---------- pills & buttons ---------- */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
  .pill svg.i { width: 12px; height: 12px; }
  .o-succeeded { background: var(--ok-bg); color: var(--ok); }
  .o-failed { background: var(--fail-bg); color: var(--fail); }
  .o-degraded { background: var(--warn-bg); color: var(--warn); }
  .o-running { background: var(--run-bg); color: var(--run); }
  .o-unknown { background: var(--unk-bg); color: var(--unk); border: 1px dashed var(--unk); }
  .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; }
  .tag-drill { background: var(--warn-bg); color: var(--warn); }
  .tag-live { background: var(--ok-bg); color: var(--ok); }
  .tag-config { background: var(--run-bg); color: var(--run); }
  .recb { font-size: 10.5px; font-weight: 600; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-icon { padding: 6px; }

  /* ---------- pipeline (player) ---------- */
  .pl-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 0; }
  .pl-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pl-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
  .badge-replay { background: var(--surface); border: 1px solid var(--border-strong); color: var(--muted); }
  .badge-live { background: var(--ok-bg); color: var(--ok); }
  .badge-sim { border: 1px dashed var(--border-strong); color: var(--subtle); font-weight: 500; letter-spacing: 0; }

  .canvas { position: relative; padding: 40px 22px 26px; background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 14px 14px; }
  .gapchip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; opacity: 0; transition: opacity .2s; white-space: nowrap; pointer-events: none; }
  .gapchip.on { opacity: 1; }

  .pipeline { display: flex; align-items: flex-start; list-style: none; margin: 0; padding: 0; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
  .pn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-weight: 500; font-size: 13px; transition: background-color .25s, border-color .25s, color .25s; }
  .timer { font-size: 12px; color: var(--subtle); font-variant-numeric: tabular-nums; min-height: 17px; }
  .line { flex: 1 1 0; min-width: 8px; height: 2px; margin-top: 15px; background: var(--border-strong); border-radius: 2px; position: relative; overflow: hidden; transition: background-color .25s; }
  .line.done { background: color-mix(in srgb, var(--ok) 55%, transparent); }
  .line.active::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--run), transparent); animation: flow 1.1s linear infinite; }
  @keyframes flow { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .s-running .pn, .seg.s-running { border-color: var(--run); background: var(--run-bg); color: var(--run); }
  .s-running .pn { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 35%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
  .s-succeeded .pn, .seg.s-succeeded { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-bg); color: var(--ok); }
  .s-failed .pn, .seg.s-failed { border-color: color-mix(in srgb, var(--fail) 50%, transparent); background: var(--fail-bg); color: var(--fail); }
  .s-degraded .pn, .seg.s-degraded { border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: var(--warn-bg); color: var(--warn); }
  .s-unknown .pn, .seg.s-unknown { border-style: dashed; border-color: var(--unk); background: var(--unk-bg); color: var(--unk); }
  .s-skipped .pn, .seg.s-skipped { border-style: dotted; opacity: .6; }
  .s-running .timer { color: var(--run); font-weight: 600; }
  .s-failed .timer { color: var(--fail); }
  .spin { animation: spin .9s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pl-status { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 13px; min-height: 44px; }
  .pl-status .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .controls { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 120px; accent-color: var(--link); }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; min-width: 88px; text-align: right; }

  button.pn { cursor: pointer; font: inherit; font-weight: 500; font-size: 13px; }
  button.pn:hover { filter: brightness(.97); }
  .node.focus .pn { outline: 2px dashed color-mix(in srgb, var(--link) 60%, transparent); outline-offset: 3px; }
  .node.focus.pinned .pn { outline-style: solid; outline-color: var(--link); }

  /* ---------- stage detail panel ---------- */
  .stage-panel { border-top: 1px solid var(--border); }
  .sp-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; flex-wrap: wrap; }
  .sp-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .sp-title.s-running { color: var(--run); } .sp-title.s-succeeded { color: var(--ok); } .sp-title.s-failed { color: var(--fail); }
  .sp-title.s-unknown { color: var(--unk); } .sp-title.s-pending, .sp-title.s-skipped { color: var(--muted); }
  .sp-state { color: var(--muted); font-size: 13px; }
  .sp-mode { color: var(--subtle); font-size: 12.5px; }
  .sp-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; padding: 12px 16px 16px; align-items: start; }
  .where { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 12px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .where dt { color: var(--muted); }
  .where dd { margin: 0; overflow-wrap: anywhere; }
  .where .mono { font-size: 11.5px; }
  .steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 1px 10px; padding: 8px 12px; border-top: 1px solid var(--border); align-items: center; }
  .step:first-child { border-top: 0; }
  .step .ic { display: grid; place-items: center; color: var(--subtle); }
  .step .nm { font-weight: 500; font-size: 13px; }
  .step .dt { grid-column: 2; color: var(--muted); font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
  .step .tm { grid-column: 3; grid-row: 1; font-variant-numeric: tabular-nums; color: var(--subtle); font-size: 12px; }
  .step.st-running { background: var(--run-bg); }
  .step.st-running .ic, .step.st-running .tm { color: var(--run); }
  .step.st-running .tm { font-weight: 600; }
  .step.st-succeeded .ic { color: var(--ok); }
  .step.st-failed .ic, .step.st-failed .nm, .step.st-failed .tm { color: var(--fail); }
  .step.st-failed { background: var(--fail-bg); }
  .step.st-pending { opacity: .45; }
  .step.st-skipped { opacity: .55; }
  .step.st-skipped .nm { text-decoration: line-through; text-decoration-color: var(--subtle); }
  .sp-note { color: var(--muted); font-size: 13px; padding: 14px; border: 1px dashed var(--border-strong); border-radius: 8px; }

  .prov { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; flex: none; }

  /* ---------- table ---------- */
  .tr { display: grid; grid-template-columns: minmax(200px, 1.5fr) 186px minmax(120px, .8fr) 104px 84px 92px; gap: 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--border); }
  .th { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 13px; padding: 10px 16px; border-top: 0; }
  .row { cursor: pointer; background: var(--surface); }
  .row:hover { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
  .row.sel { box-shadow: inset 3px 0 0 var(--link); }
  .rel-l1 { display: flex; align-items: center; gap: 7px; font-weight: 600; flex-wrap: wrap; }
  .rel-l2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-rel { min-width: 0; }
  .c-start, .c-dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .c-act { text-align: right; }
  .mini { display: flex; gap: 3px; }
  .seg { width: 24px; height: 22px; border-radius: 5px; display: grid; place-items: center; border: 1px solid var(--border-strong); color: var(--subtle); background: var(--surface); }
  .seg svg.i { width: 12px; height: 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border-top: 1px solid var(--border); }

  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .filters select { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 8px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }

  .vdots { display: flex; gap: 4px; }
  .vd { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border-strong); }
  .vd.ok { background: var(--ok); border-color: var(--ok); }
  .vd.bad { background: var(--fail); border-color: var(--fail); }

  /* ---------- toast ---------- */
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: var(--toast-shadow); display: flex; gap: 10px; align-items: center; transform: translateY(16px); opacity: 0; transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); z-index: 10; pointer-events: none; font-size: 13px; }
  .toast.on { opacity: 1; transform: none; pointer-events: auto; }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  }
  @media (max-width: 760px) {
    .fixture, .top-link span { display: none; }
    .metrics { grid-template-columns: 1fr 1fr; }
    .tile:nth-child(3) { border-left: 0; }
    .tile:nth-child(n+3) { border-top: 1px solid var(--border); }
    .pipeline.big { flex-direction: column; align-items: stretch; }
    .pipeline.big .node { flex-direction: row; justify-content: space-between; align-items: center; }
    .pipeline.big .line { width: 2px; min-width: 0; height: 12px; flex: none; margin: 0 0 0 22px; }
    .pipeline.big .line.active::after { background: linear-gradient(180deg, transparent, var(--run), transparent); animation-name: flowv; }
    @keyframes flowv { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
    .canvas { padding: 40px 16px 18px; }
    .tr { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
    .th { display: none; }
    .c-rel { grid-column: 1; grid-row: 1; }
    .c-out { grid-column: 2; grid-row: 1; justify-self: end; }
    .c-pipe { grid-column: 1; grid-row: 2; }
    .c-act { grid-column: 2; grid-row: 2; }
    .c-start, .c-dur { display: none; }
    .controls .clock { order: 5; text-align: left; }
    .sp-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 420px) {
    .seg { width: 20px; }
    .crumb-cur, .crumb-sep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="crumbs">
    <span class="brand">
      mybuilds
    </span>
    <span class="crumb-sep" aria-hidden="true">›</span>
    <span class="crumb-cur" id="crumb">Pipelines</span>
  </div>
  <div class="top-actions">

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------ */
  /* Vocabulary                                                          */
  /* ------------------------------------------------------------------ */
  const STAGES = [['source', 'Source'], ['build', 'Build'], ['publish', 'Publish'], ['gitops', 'GitOps'], ['reconcile', 'Reconcile'], ['rollout', 'Rollout'], ['verify', 'Verify']];
  const LABEL = Object.fromEntries(STAGES);
  // Config-change releases (plan §5.2): no source build, the GitOps commit is the start.
  const CONFIG_STAGES = [['gitops', 'GitOps commit'], ['reconcile', 'Reconcile'], ['rollout', 'Rollout'], ['verify', 'Verify']];
  const shaOf = r => r.kind === 'config' ? r.gitops : r.sha;
  const labelOf = (r, k) => (r.stageList.find(([x]) => x === k) || [k, LABEL[k]])[1];
  const PROV = { github: 'GitHub', ci: 'CI', argocd: 'Argo CD', k8s: 'Kubernetes', verifier: 'Verifier', mybuilds: 'mybuilds' };
  const TERMINAL = new Set(['succeeded', 'failed', 'degraded', 'unknown', 'skipped']);

  const svg = (d, cls = '') => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    pending: svg('<circle cx="8" cy="8" r="3.3"/>'),
    running: svg('<circle cx="8" cy="8" r="5.5" opacity=".25"/><path d="M13.5 8A5.5 5.5 0 0 0 8 2.5"/>', 'spin'),
    succeeded: svg('<path d="M3.5 8.5l3 3 6-7"/>'),
    failed: svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'),
    degraded: svg('<path d="M8 3.5v5.5"/><circle cx="8" cy="12.2" r=".5" fill="currentColor"/>'),
    unknown: svg('<path d="M6 6a2 2 0 1 1 3 1.7c-.7.4-1 .8-1 1.6"/><circle cx="8" cy="12.2" r=".5" fill="currentColor"/>'),
    skipped: svg('<path d="M4.5 8h7"/>'),
  };
  const PLAY = svg('<path d="M4.5 3l8 5-8 5z"/>');
  const PAUSE = svg('<path d="M5 3.5v9M11 3.5v9"/>');
  const RESTART = svg('<path d="M2.8 8a5.2 5.2 0 1 0 1.6-3.8"/><path d="M2.5 2.5v3h3"/>');
  const COPY = svg('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.8c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3h1.7"/>');
  const REPLAY_ICON = svg('<path d="M4.5 3l8 5-8 5z"/>');

  /* ------------------------------------------------------------------ */
  /* Formatting                                                          */
  /* ------------------------------------------------------------------ */
  function fmt(sec, terminal) {
    sec = Math.max(0, Math.floor(sec));
    if (sec === 0 && terminal) return '<1s';
    if (sec < 60) return `${sec}s`;
    const m = Math.floor(sec / 60);
    if (m < 60) return `${m}m ${String(sec % 60).padStart(2, '0')}s`;
    return `${Math.floor(m / 60)}h ${m % 60}m`;
  }
  const clock = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
  const day = d => d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  function relTime(d) {
    const s = (Date.now() - d.getTime()) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400 * 2) return `${Math.floor(s / 3600)}h ago`;
    return `${day(d)}, ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })}`;
  }
  const shortDigest = d => d.slice(0, 13) + '…' + d.slice(-4);
  function hex(seed, n) {
    let h = 2166136261;
    for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    let out = '';
    while (out.length < n) { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; out += (h >>> 0).toString(16).padStart(8, '0'); }
    return out.slice(0, n);
  }

  /* ------------------------------------------------------------------ */
  /* Fixture releases (event timelines, as the server would record them) */
  /* ------------------------------------------------------------------ */
  const NOW = Date.now();
  const ago = (d, h = 0, m = 0) => new Date(NOW - ((d * 24 + h) * 60 + m) * 60000);
  const S = (dt, stage, state, provider, msg, extra = {}) => ({ dt, stage, state, provider, msg, ...extra });

  const PS = { service: 'personal-site', repo: 'spicyhek/homelab-hosted-personal-site', artifact: 'ghcr.io/spicyhek/homelab-hosted-personal-site', workflowFile: 'build-and-push.yml', runner: 'ubuntu-24.04-arm', url: 'https://brendanmanley.com', host: 'brendanmanley.com', ns: 'personal-site', replicas: 3 };
  const MB = { service: 'mybuilds', repo: 'spicyhek/mybuilds', artifact: 'ghcr.io/spicyhek/mybuilds', workflowFile: 'release.yml', runner: 'ubuntu-24.04-arm', url: 'https://mybuilds.brendanmanley.com', host: 'mybuilds.brendanmanley.com', ns: 'mybuilds', replicas: 1 };
  const DT = { service: 'drill-target', repo: 'spicyhek/mybuilds', artifact: 'ghcr.io/spicyhek/mybuilds/drill-target', workflowFile: 'drill.yml', runner: 'ubuntu-24.04-arm', url: 'https://drill.mybuilds.brendanmanley.com', host: 'drill.mybuilds.brendanmanley.com', ns: 'drill-target', replicas: 1, drill: true };

  // One stage = an ordered list of steps. Each step emits a "started" event,
  // optional progress events (mids: [cumulative fraction of dur, detail]) and a
  // "done" event. A step with halt:true fails the stage; later steps are skipped.
  function stage(k, provider, items, { lead = 1, end = 'succeeded' } = {}) {
    const out = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i], last = i === items.length - 1;
      const gap = i === 0 ? lead : (it.gap || 0);
      const after = it.stage || (it.halt ? 'failed' : last ? end : 'running');
      const prov = it.provider || provider;
      const tag = it.rec ? ' · reconstructed' : '';
      const done = { step: it.name, ss: it.ss || 'succeeded', detail: it.done, sample: it.sample, rec: it.rec };
      if (it.dur > 0) {
        out.push(S(gap, k, 'running', provider, `${it.name} · ${it.start}${tag}`, { step: it.name, ss: 'running', detail: it.start, rec: it.rec }));
        let used = 0;
        for (const [f, d] of it.mids || []) { const dt = f * it.dur - used; used += dt; out.push(S(dt, k, 'running', provider, `${it.name} · ${d}`, { step: it.name, ss: 'running', detail: d })); }
        out.push(S(it.dur - used, k, after, prov, `${it.name} · ${it.done}${tag}`, done));
      } else {
        out.push(S(gap, k, after, prov, `${it.name} · ${it.done}${tag}`, done));
      }
      if (it.halt) {
        for (const rest of items.slice(i + 1)) out.push(S(0, k, 'failed', provider, `${rest.name} · skipped`, { step: rest.name, ss: 'skipped', detail: 'skipped after failure' }));
        break;
      }
    }
    return out;
  }

  const LAT = [82, 79, 91, 77, 84, 88, 80];
  const rsName = r => `${r.service}-${hex(r.id + 'rs', 6)}`;
  const podName = (r, i) => `${rsName(r)}-${hex(r.id + 'pod' + i, 5)}`;

  const srcSteps = r => stage('source', 'github', [
    { name: 'Push to main', dur: 0, done: `${r.sha} “${r.msg}”` },
    { name: 'Workflow triggered', dur: 0, done: `${r.workflowFile} · run #${r.run} queued` },
  ], { lead: 0 });

  const buildSteps = (r, { failTest = false } = {}) => {
    const b = r.b || 41;
    const items = [
      { name: 'Set up job', dur: 3, start: `waiting for a ${r.runner} runner`, done: `${r.runner} · GitHub-hosted runner ready` },
      { name: 'Checkout', dur: 1, start: 'actions/checkout@v4', done: `${r.sha} · fetch-depth 1` },
    ];
    if (r.service === 'mybuilds') items.push(
      { name: 'Set up Go', dur: 3, start: 'actions/setup-go@v5', done: 'go1.23.3 linux/arm64 · module cache hit' },
      { name: 'Build web UI', dur: 9, start: 'npm ci && npm run build (web/)', done: 'web/dist built · embedded into the binary' },
      { name: 'go test ./...', dur: 8, start: 'go test -race ./...', done: 'ok · projector replays testdata/releases/*.jsonl' },
      { name: 'Build image', dur: b - 24, start: 'docker/build-push-action@v6 · linux/arm64', done: `image built · mybuilds:${r.sha}` },
    );
    else if (r.drill) items.push(
      { name: 'Set up Go', dur: 3, start: 'actions/setup-go@v5', done: 'go1.23.3 linux/arm64 · module cache hit' },
      failTest
        ? { name: 'go test ./drill/...', dur: 6, start: 'go test -race ./drill/...', done: '--- FAIL: TestHealthz (0.02s) · exit status 1', ss: 'failed', halt: true }
        : { name: 'go test ./drill/...', dur: 6, start: 'go test -race ./drill/...', done: 'ok  drill  0.41s · 14 tests' },
      { name: 'Build image', dur: b - 13, start: 'docker/build-push-action@v6 · linux/arm64', done: `image built · drill-target:${r.sha}` },
    );
    else items.push(
      { name: 'Set up Docker Buildx', dur: 4, start: 'docker/setup-buildx-action@v3', done: 'builder ready · cache from type=gha' },
      { name: 'Log in to ghcr.io', dur: 1, start: 'docker/login-action@v3', done: 'logged in as github-actions[bot]' },
      { name: 'Build image', dur: b - 13, start: 'docker/build-push-action@v6 · linux/arm64', done: `image built · personal-site:${r.sha}` },
      { name: 'Smoke test', dur: 4, start: 'docker run · GET /healthz', done: '200 · X-Release-ID header present' },
    );
    return stage('build', 'github', items);
  };

  // Step names and timings come from workflow_job (no log text), so detail
  // lines only use facts mybuilds knows from structured events.
  const publishSteps = r => stage('publish', 'github', [
    { name: 'Push image', dur: (r.p || 8) - 2, start: `push to ${r.artifact}`, done: `pushed ${r.artifact}` },
    { name: 'Resolve digest', dur: 1, start: 'docker buildx imagetools inspect', done: shortDigest(r.digest) },
    { name: 'Send release.published', dur: 1, start: 'POST /api/v1/ci-events · HMAC-signed', done: `release.published · ${shortDigest(r.digest)}`, provider: 'ci' },
  ]);

  const gitopsSteps = r => stage('gitops', 'github', [
    { name: 'Checkout homelab-infra', dur: 1, start: 'spicyhek/homelab-infra@main', done: 'fine-grained token · contents: write' },
    { name: 'Pin image digest', dur: 1, start: 'kustomize edit set image', done: `k8s/apps/${r.service}/kustomization.yml → @${shortDigest(r.digest)}` },
    { name: 'Set release annotations', dur: 0, done: `release-id ${r.id}` },
    { name: 'Commit and push', dur: (r.g || 6) - 3, start: 'git push origin main · as mybuilds-bot', done: `homelab-infra@${r.gitops}` },
    { name: 'Send gitops.updated', dur: 1, start: 'POST /api/v1/ci-events · HMAC-signed', done: `gitops.updated · homelab-infra@${r.gitops}`, provider: 'ci' },
  ]);

  const recSteps = r => stage('reconcile', 'argocd', [
    { name: 'Revision detected', dur: 0, done: `homelab-infra@${r.gitops} · ${fmt(r.aw || 132)} after push` },
    { name: 'Sync', dur: r.sy || 14, start: `on-sync-running · applying to namespace ${r.ns}`, done: `on-sync-succeeded · Synced to ${r.gitops}` },
  ], { lead: r.aw || 132 });

  const newRs = r => ({ name: 'New ReplicaSet', dur: 1, start: `Deployment generation ${r.gen}`, done: `${rsName(r)} created · maxSurge 1, maxUnavailable 0` });
  const oldRs = r => ({ name: 'Old ReplicaSet scaled down', dur: 1, start: 'terminating previous pods', done: `0 old replicas · ${r.replicas}/${r.replicas} available` });
  const digestCheck = r => ({ name: 'Digest check', dur: 0, done: `${r.replicas}/${r.replicas} Ready pods run ${shortDigest(r.digest)}` });
  const roSteps = (r, extra = []) => {
    const n = r.replicas, items = [newRs(r)];
    for (let i = 1; i <= n; i++) items.push({ name: `Pod ${i} of ${n}`, dur: r.ro || 7, start: `${podName(r, i)} · pulling image by digest`, mids: [[0.45, `${podName(r, i)} · Running · readiness probe /readyz`]], done: `${podName(r, i)} · Ready · imageID ${shortDigest(r.digest)}` });
    items.push(oldRs(r), ...extra, digestCheck(r));
    return stage('rollout', 'k8s', items);
  };

  // mybuilds replacing itself (plan §8.8): Recreate stops the observer first.
  const roSelf = r => {
    const pod = podName(r, 1), old = `${r.service}-${hex(r.id + 'oldrs', 6)}-${hex(r.id + 'oldpod', 5)}`;
    return stage('rollout', 'k8s', [
      { name: 'Rollout started', dur: 0, done: `Deployment generation ${r.gen} · strategy Recreate · seen by the old pod` },
      { name: 'Old pod stopping', dur: 2, start: `${old} · SIGTERM`, done: `${old} · events flushed · observer offline` },
      { name: 'New ReplicaSet', dur: 1, start: 'from metadata.creationTimestamp', done: `${rsName(r)} created`, rec: true },
      { name: 'Pod 1 of 1', dur: 21, start: `${pod} · created`, done: `${pod} · Ready (from condition lastTransitionTime)`, rec: true },
      { name: 'Back online', dur: 0, gap: 1, provider: 'mybuilds', done: 'informer initial list · 3 queued events drained from SQS' },
      { name: 'Digest check', dur: 0, done: `1/1 Ready pod runs ${shortDigest(r.digest)}` },
    ]);
  };

  // A human commit to homelab-infra with no new artifact (plan §8.7, rule 3).
  const cfgSteps = r => [
    ...stage('gitops', 'github', [
      { name: 'Commit', dur: 0, done: `homelab-infra@${r.gitops} by ${r.author} · “${r.msg}”` },
    ], { lead: 0 }),
    ...stage('reconcile', 'argocd', [
      { name: 'Revision detected', dur: 0, done: `homelab-infra@${r.gitops} · ${fmt(r.aw)} after commit` },
      { name: 'Attributed', dur: 0, provider: 'mybuilds', done: `no release has gitops_sha ${r.gitops} · human author, no Release-Id trailer → config release` },
      { name: 'Sync', dur: r.sy || 14, start: `on-sync-running · applying to namespace ${r.ns}`, done: `on-sync-succeeded · Synced to ${r.gitops}` },
    ], { lead: r.aw }),
    ...roSteps(r, [{ name: 'Attribution check', dur: 0, provider: 'mybuilds', done: `pods keep release-id ${r.appId} · that release is complete and is not reopened` }]),
    ...verSteps(r, (i, l) => ({ ok: true, done: `GET /healthz 200 · ${l}ms · X-Release-ID ${r.appId} (unchanged, as expected) · cf-ray …-SJC` })),
  ];
  const roCrash = r => stage('rollout', 'k8s', [
    newRs(r),
    { name: 'Pod 1 of 1', dur: 120, start: `${podName(r, 1)} · pulling image by digest`,
      mids: [[0.08, `${podName(r, 1)} · Error · exit 1 · restart 1`], [0.33, `${podName(r, 1)} · CrashLoopBackOff · restart 3 · back-off 40s`], [0.75, `${podName(r, 1)} · CrashLoopBackOff · restart 5 · old replica still serving`]],
      done: 'ProgressDeadlineExceeded after 120s · old replica still serving', ss: 'failed', halt: true },
    oldRs(r), digestCheck(r),
  ]);

  const verSteps = (r, check) => {
    const items = [{ name: 'DNS + TLS', dur: 1, start: `resolve ${r.host}`, done: `${r.host} → Cloudflare · TLS 1.3 · certificate valid` }];
    for (let i = 1; i <= 5; i++) {
      const c = check(i, LAT[(i + (r.run || 0)) % 7]);
      items.push({ name: `Check ${i} of 5`, dur: 0, gap: i === 1 ? 1 : (r.vi || 30), done: c.done, ss: c.ok ? 'succeeded' : 'failed', sample: { ok: c.ok }, stage: i === 5 ? (c.ok ? 'succeeded' : 'failed') : 'running' });
    }
    return stage('verify', 'verifier', items);
  };
  const verOk = r => verSteps(r, (i, l) => ({ ok: true, done: `GET /healthz 200 · ${l}ms · X-Release-ID ✓ · cf-ray …-SJC` }));
  const verUnhealthy = r => verSteps(r, (i, l) => ({ ok: false, done: `GET /healthz 500 · ${l}ms · ${i} of 5 failed${i === 5 ? ' · pods Ready, service unhealthy' : ''}` }));
  const verStale = r => verSteps(r, (i) => ({ ok: false, done: `200 · X-Release-ID ${r.service}/${r.prev}/production/${r.run - 1} ≠ expected${i === 5 ? ' · release mismatch' : ''}` }));

  const skip = (...ks) => ks.map(k => S(0, k, 'skipped', 'mybuilds', `${LABEL[k]} skipped · upstream stage failed`));
  const pre = r => [...srcSteps(r), ...buildSteps(r), ...publishSteps(r), ...gitopsSteps(r)];
  const full = r => [...pre(r), ...recSteps(r), ...roSteps(r), ...verOk(r)];

  // Where each stage runs, for the stage detail panel. Only allowlisted fields:
  // no node names, internal IPs or raw payloads.
  function whereRows(r, k) {
    const m = s => `<span class="mono">${esc(s)}</span>`;
    if (r.kind === 'config' && k === 'gitops') return [['System', 'GitHub · homelab-infra'], ['Commit', m('homelab-infra@' + r.gitops)], ['Author', `${m(r.author)} (human)`], ['Release kind', 'config · no new artifact'], ['Evidence', 'Argo CD commit metadata']];
    if (r.self && k === 'rollout') return [['System', 'Kubernetes (k3s)'], ['Workload', m('Deployment/mybuilds')], ['Strategy', `${m('Recreate')} · single SQLite writer`], ['Observer', 'itself (gap while replacing)'], ['Evidence', 'old pod before, informer list after']];
    if (r.self && k === 'verify') return [['System', 'mybuilds verifier → Cloudflare'], ['Endpoint', m(r.url + '/healthz')], ['Pass rule', '5 in a row, 30s apart'], ['Evidence', `${m('X-Release-ID')} header`], ['Independent check', 'AWS probe of /healthz']];
    return {
      source: [['System', 'GitHub'], ['Repository', m(r.repo)], ['Ref', `${m('main')} @ ${m(r.sha)}`], ['Evidence', `${m('workflow_run')} webhook`]],
      build: [['System', 'GitHub Actions'], ['Workflow', m('.github/workflows/' + r.workflowFile)], ['Job', m('build')], ['Runner', `${m(r.runner)} (GitHub-hosted)`], ['Evidence', `${m('release.published')} or the job's step results`], ['Steps', `${m('workflow_job')}, at job end`]],
      publish: [['System', 'GitHub Actions → GHCR'], ['Job', m('build')], ['Image', m(r.artifact)], ['Platform', m('linux/arm64')], ['Evidence', `signed ${m('release.published')}`], ['Steps', `${m('workflow_job')}, at job end`]],
      gitops: [['System', 'GitHub Actions → homelab-infra'], ['Job', m('bump-gitops')], ['File', m(`k8s/apps/${r.service}/kustomization.yml`)], ['Commits as', m('mybuilds-bot')], ['Evidence', `signed ${m('gitops.updated')}`], ['Steps', `${m('workflow_job')}, at job end`]],
      reconcile: [['System', 'Argo CD (in cluster)'], ['Application', m(r.service)], ['Source', m('homelab-infra@main')], ['Target', `namespace ${m(r.ns)}`], ['Evidence', 'Argo CD Notifications']],
      rollout: [['System', 'Kubernetes (k3s)'], ['Workload', m('Deployment/' + r.service)], ['Namespace', m(r.ns)], ['Replicas', `${r.replicas} · linux/arm64`], ['Evidence', 'read-only informer']],
      verify: [['System', 'mybuilds verifier → Cloudflare'], ['Endpoint', m(r.url + '/healthz')], ['Pass rule', '5 in a row, 30s apart'], ['Evidence', `${m('X-Release-ID')} header`]],
    }[k];
  }

  function mk(base, o, steps, compress = true) {
    const r = { ...base, ...o };
    r.kind = r.kind || 'application';
    r.stageList = r.kind === 'config' ? CONFIG_STAGES : STAGES;
    r.id = r.kind === 'config' ? `${r.service}/config/${r.gitops}/production` : `${r.service}/${r.sha}/production/${r.run}`;
    r.env = 'production';
    // A config release keeps the running app release's digest (r.sha is that release's commit).
    r.digest = 'sha256:' + hex(r.sha + 'digest', 64);
    r.gitops = r.gitops || hex(r.sha + 'gitops', 7);
    r.steps = steps(r);
    build(r, compress);
    return r;
  }

  // Precompute absolute (real) time and virtual playback time per event.
  // Idle gaps longer than 3s are compressed to 3s of playback.
  function build(r, compress) {
    let t = 0, vt = 0;
    r.events = r.steps.map((s, i) => { t += s.dt; return { ...s, t, i }; });
    r.events.forEach((e, i) => {
      if (i) { const g = e.t - r.events[i - 1].t; vt += compress ? Math.min(g, 3) : g; e.compressed = compress && g > 3; }
      e.vt = vt;
    });
    r.compress = compress;
    r.total = vt;
    r.duration = t;
    r.final = project(r, Infinity).st;
  }

  // The projector the server would run: events in order -> stage state.
  function project(r, v) {
    const st = {};
    for (const [k] of r.stageList) st[k] = { state: 'pending', start: null, end: null, last: null, samples: [], steps: new Map() };
    let idx = -1;
    for (const e of r.events) {
      if (e.vt > v + 1e-9) break;
      idx = e.i;
      const s = st[e.stage];
      s.last = e;
      if (e.step) {
        let p = s.steps.get(e.step);
        if (!p) { p = { name: e.step, state: 'pending', start: null, end: null, detail: '' }; s.steps.set(e.step, p); }
        if (p.start == null && e.ss !== 'skipped') p.start = e.t;
        if (e.ss !== 'running') p.end = e.t;
        p.state = e.ss;
        p.detail = e.detail;
        p.rec = p.rec || !!e.rec;
      }
      // workflow_job "completed": one delivery reports every step of the job,
      // stamped with the steps' own times. Stage durations are refined from them.
      if (e.batch) {
        const touched = new Set();
        for (const b of e.batch) {
          const s2 = st[b.stage];
          s2.steps.set(b.step, { name: b.step, state: b.ss, start: b.start, end: b.end, detail: b.detail });
          if (s2.start == null || b.start < s2.start) s2.start = b.start;
          touched.add(b.stage);
        }
        for (const k of touched) {
          const s2 = st[k];
          if (TERMINAL.has(s2.state)) s2.end = Math.max(...[...s2.steps.values()].map(p => p.end ?? -Infinity));
        }
      }
      if (e.state == null) continue;
      if (e.state === 'skipped') { s.state = 'skipped'; continue; }
      if (s.start == null) s.start = e.t;
      if (TERMINAL.has(e.state)) s.end = e.t;
      s.state = e.state;
      if (e.sample) s.samples.push(e.sample);
    }
    return { st, idx };
  }

  function realAt(r, v) {
    const E = r.events;
    if (v <= 0) return 0;
    let i = 0;
    while (i + 1 < E.length && E[i + 1].vt <= v) i++;
    if (i === E.length - 1) return E[i].t;
    const seg = E[i + 1].vt - E[i].vt;
    return seg ? E[i].t + (v - E[i].vt) * (E[i + 1].t - E[i].t) / seg : E[i].t;
  }

  function outcome(st) {
    const s = Object.values(st).map(x => x.state);
    if (s.includes('failed')) return 'failed';
    if (s.includes('running') || s.includes('pending')) return 'running';
    if (s.includes('unknown')) return 'unknown';
    if (s.includes('degraded')) return 'degraded';
    return 'succeeded';
  }
  function outcomePill(st) {
    const o = outcome(st);
    let text = { succeeded: 'Succeeded', running: 'In progress', unknown: 'Unknown', degraded: 'Degraded' }[o];
    if (o === 'failed') text = `Failed · ${LABEL[Object.keys(st).find(k => st[k].state === 'failed')]}`;
    return `<span class="pill o-${o}">${ICON[o === 'running' ? 'running' : o]}${text}</span>`;
  }

  const RELEASES = [
    mk(PS, { run: 63, sha: '4f2c9a1', msg: 'Tighten hero copy', start: ago(0, 5, 12), gen: 64, aw: 118 }, full),
    mk(PS, { kind: 'config', sha: '4f2c9a1', appId: 'personal-site/4f2c9a1/production/63', gitops: 'e3b91c7', author: 'spicyhek', msg: 'Raise personal-site memory limit to 96Mi', start: ago(1, 1, 10), gen: 65, aw: 94 }, cfgSteps),
    mk(MB, { run: 27, sha: '7d3a0c4', msg: 'Add stage detail panel', start: ago(1, 20, 30), gen: 28, b: 58, aw: 102, self: true }, r => [...pre(r), ...recSteps(r), ...roSelf(r), ...verOk(r)]),
    mk(PS, { run: 62, sha: 'd03b7e5', msg: 'Update projects section', start: ago(2, 3, 40), gen: 63, aw: 151, b: 44 }, full),
    mk(DT, { run: 16, sha: '5ac81f0', msg: 'drill: healthy (restore)', scenario: 'healthy', start: ago(3, 20, 2), gen: 17, aw: 64, b: 22, p: 6 }, full),
    mk(DT, { run: 15, sha: 'e917c42', prev: '0b4d6e2', msg: 'drill: stale-header', scenario: 'stale-header', start: ago(3, 20, 24), gen: 16, aw: 71, b: 21, p: 6 }, r => [...pre(r), ...recSteps(r), ...roSteps(r), ...verStale(r)]),
    mk(DT, { run: 14, sha: '0b4d6e2', msg: 'drill: unhealthy', scenario: 'unhealthy', start: ago(3, 20, 46), gen: 15, aw: 58, b: 23, p: 6 }, r => [...pre(r), ...recSteps(r), ...roSteps(r), ...verUnhealthy(r)]),
    mk(DT, { run: 13, sha: '9c27a5d', msg: 'drill: crashloop', scenario: 'crashloop', start: ago(3, 21, 8), gen: 14, aw: 66, b: 20, p: 6 }, r => [...pre(r), ...recSteps(r), ...roCrash(r), ...skip('verify')]),
    mk(DT, { run: 12, sha: '1e8f3b7', msg: 'drill: build-fail', scenario: 'build-fail', start: ago(3, 21, 31), b: 20 }, r => [
      ...srcSteps(r), ...buildSteps(r, { failTest: true }),
      ...skip('publish', 'gitops', 'reconcile', 'rollout', 'verify'),
    ]),
    mk(PS, { run: 61, sha: 'a6e2d19', msg: 'Fix dark-mode contrast', start: ago(5, 2, 8), gen: 62 }, r => [
      ...pre(r),
      S(374, 'reconcile', 'unknown', 'mybuilds', `no Argo CD sync event for ${r.gitops} · rollout observed without sync evidence`),
      ...roSteps(r), ...verOk(r),
    ]),
    mk(PS, { run: 60, sha: '71c0f3b', msg: 'Add status page link', start: ago(8, 1, 30), gen: 61, aw: 97, b: 39 }, full),
    mk(PS, { run: 59, sha: 'c4d90ea', msg: 'Compress hero image', start: ago(11, 4, 0), gen: 60, aw: 163, b: 47 }, full),
  ];

  /* ------------------------------------------------------------------ */
  /* Player state                                                        */
  /* ------------------------------------------------------------------ */
  const P = { rel: null, v: 0, playing: false, speed: 4, picked: false, focus: null };
  let LIVE = null;
  let dirty = true, sideKey = '';

  const liveV = r => (performance.now() - r.liveStart) / 1000;

  function load(r, { play = false, atEnd = false } = {}) {
    P.rel = r;
    P.v = atEnd ? r.total : 0;
    P.playing = play && !r.live;
    P.focus = null;
    if (reduced && play) P.v = 0;
    sideKey = '';
    dirty = true;
    paintRows();
  }

  function snapV(r, v) {
    let s = 0;
    for (const e of r.events) { if (e.vt <= v + 1e-9) s = e.vt; else break; }
    return s;
  }

  /* ------------------------------------------------------------------ */
  /* Rendering                                                           */
  /* ------------------------------------------------------------------ */
  function timerText(s, real) {
    if (s.state === 'skipped') return 'skipped';
    if (s.state === 'unknown') return 'no evidence';
    if (s.state === 'running') return fmt(real - s.start);
    if (TERMINAL.has(s.state) && s.start != null) return fmt(s.end - s.start, true);
    return '';
  }

  function pipelineHTML(r, st, real, focus, pinned) {
    const list = r.stageList;
    return list.map(([k, label], i) => {
      const s = st[k];
      const prev = i ? st[list[i - 1][0]] : null;
      const line = i ? `<li class="line ${prev.state === 'succeeded' ? 'done' : ''} ${s.state === 'running' ? 'active' : ''}" aria-hidden="true"></li>` : '';
      const tt = timerText(s, real);
      return `${line}<li class="node s-${s.state} ${k === focus ? 'focus' : ''} ${k === focus && pinned ? 'pinned' : ''}">
        <button class="pn" data-stage="${k}" aria-pressed="${k === focus && pinned}" aria-label="${label}: ${s.state}${tt ? ', ' + tt : ''}. Show stage detail">${ICON[s.state]}<span>${label}</span></button><span class="timer">${tt || '&nbsp;'}</span></li>`;
    }).join('');
  }

  // The stage "where things are happening now": the stage of the latest event,
  // or the next one when that stage just finished and the release is still going.
  function activeStage(r, st, idx) {
    const list = r.stageList;
    let k = list[0][0];
    for (let i = idx; i >= 0; i--) if (r.events[i].state !== 'skipped') { k = r.events[i].stage; break; }
    const pos = list.findIndex(([x]) => x === k);
    if (st[k].state === 'succeeded' && outcome(st) === 'running' && pos < list.length - 1) return list[pos + 1][0];
    return k;
  }

  const STATE_WORD = { pending: 'Pending', running: 'Running', succeeded: 'Succeeded', failed: 'Failed', degraded: 'Degraded', skipped: 'Skipped', unknown: 'Unknown' };

  function stagePanelHTML(r, st, real, k, pinned) {
    const list = r.stageList;
    const s = st[k], label = labelOf(r, k), i = list.findIndex(([x]) => x === k);
    const tt = s.state === 'running' || TERMINAL.has(s.state) ? timerText(s, real) : '';
    // Replays know every step the stage will run; a live release shows only what has been observed.
    const names = r.live ? [...s.steps.keys()] : [...r.final[k].steps.keys()];
    const stepTime = p => p.state === 'running' ? fmt(real - p.start) : p.state === 'skipped' ? 'skipped' : p.end != null && p.start != null ? fmt(p.end - p.start, true) : '';
    const steps = names.map(n => {
      const p = s.steps.get(n) || { state: 'pending', detail: '' };
      return `<li class="step st-${p.state}"><span class="ic">${ICON[p.state]}</span><span class="nm">${esc(n)}${p.rec ? ' <span class="recb" title="Rebuilt from Kubernetes object timestamps after restart">reconstructed</span>' : ''}</span><span class="tm">${stepTime(p)}</span>${p.detail ? `<span class="dt">${esc(p.detail)}</span>` : ''}</li>`;
    }).join('');

    let note = '';
    if (s.state === 'skipped') note = `Nothing ran here: ${esc(LABEL[Object.keys(st).find(x => st[x].state === 'failed') || 'build'])} failed, so this stage was skipped.`;
    else if (r.self && k === 'rollout' && s.steps.size) note = 'mybuilds was replacing itself (<span class="mono">Recreate</span>). Nothing was observing between the old pod stopping and the new one starting. Steps marked <b>reconstructed</b> were rebuilt afterwards from Kubernetes object timestamps.';
    else if (r.kind === 'config' && k === 'rollout' && s.steps.size) note = `Same digest and <span class="mono">release-id</span> as <span class="mono">${esc(r.appId)}</span>. That release is complete, so this rollout belongs to the config release instead of reopening it.`;
    else if (s.state === 'unknown') note = `${esc(s.last.msg)}. The stage stays <b>unknown</b> rather than being guessed green.`;
    else if (r.live && JOB_OF[k] && !s.steps.size && s.state !== 'pending') {
      const job = `<span class="mono">${JOB_OF[k]}</span>`;
      note = s.state === 'running'
        ? `Job ${job} is running on <span class="mono">${esc(r.runner)}</span>. GitHub reports step timings when the job finishes, so its steps appear then.`
        : `Confirmed by ${k === 'build' ? 'the published image (<span class="mono">release.published</span>)' : `the signed <span class="mono">${k === 'publish' ? 'release.published' : 'gitops.updated'}</span> event`}. Step timings arrive when job ${job} finishes.`;
    }
    else if (s.state === 'pending' && !s.steps.size) {
      const prev = i ? st[list[i - 1][0]] : null;
      note = k === 'reconcile' && prev && prev.state === 'succeeded'
        ? `Waiting for Argo CD to pick up <span class="mono">homelab-infra@${esc(r.gitops)}</span>. It polls the repository about every 3 minutes.`
        : `Not started. Waiting on ${esc(i ? labelOf(r, list[i - 1][0]) : 'a push')}.`;
    }
    const stepList = names.length ? `<ol class="steps">${steps}</ol>` : '';
    const body = note && !names.length ? `<div class="sp-note">${note}</div>` : `${note ? `<div class="sp-note" style="margin-bottom:10px">${note}</div>` : ''}${stepList}`;

    return `<div class="sp-head">
        <span class="sp-title s-${s.state}">${ICON[s.state]}${label}</span>
        <span class="sp-state">${STATE_WORD[s.state]}${tt ? ' · ' + tt : ''}${names.length ? ` · ${names.length} steps` : ''}</span>
        <span style="flex:1"></span>
        ${pinned
          ? `<button class="view-all" data-follow>Pinned · follow active stage</button>`
          : `<span class="sp-mode">Following the active stage · click a stage to pin it</span>`}
      </div>
      <div class="sp-grid">
        <dl class="where">${whereRows(r, k).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
        <div>${body}</div>
      </div>`;
  }

  // Only touch the DOM when markup changed, so buttons aren't replaced mid-click.
  function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }

  function miniHTML(r, st, real) {
    return `<div class="mini">${r.stageList.map(([k, label]) => {
      const s = st[k], tt = timerText(s, real);
      return `<span class="seg s-${s.state}" title="${label}: ${s.state}${tt ? ' · ' + tt : ''}" aria-label="${label}: ${s.state}">${ICON[s.state]}</span>`;
    }).join('')}</div>`;
  }

  function releaseTitle(r) {
    return `${esc(r.service)}${r.drill ? ' <span class="tag tag-drill">DRILL</span>' : ''}${r.kind === 'config' ? ' <span class="tag tag-config">CONFIG</span>' : ''}${r.live ? ' <span class="tag tag-live">LIVE</span>' : ''}`;
  }

  function paintPlayer() {
    const r = P.rel;
    if (r.live) P.v = liveV(r);
    const v = reduced && !r.live ? snapV(r, P.v) : P.v;
    const { st, idx } = project(r, v);
    const real = r.compress ? realAt(r, v) : v;

    const focus = P.focus || activeStage(r, st, idx);
    setHTML($('#pl-badge'), r.live
      ? '<span class="badge badge-live">LIVE</span> <span class="badge badge-sim">simulated</span>'
      : `<span class="badge badge-replay">REPLAY · recorded ${esc(day(r.start))} · ${P.speed}×</span>`);
    setHTML($('#pl-outcome'), outcomePill(st));
    setHTML($('#pl-title'), `${releaseTitle(r)} <span class="mono" style="font-weight:500">${esc(shaOf(r))}</span> <span style="color:var(--subtle);font-weight:500">${r.kind === 'config' ? '' : '#' + r.run}</span>`);
    setHTML($('#pl-sub'), `“${esc(r.msg)}”${r.kind === 'config' ? ` · by ${esc(r.author)}` : ''}${r.scenario ? ` · scenario: <span class="mono">${esc(r.scenario)}</span>` : ''} · ${esc(relTime(r.start))}`);
    setHTML($('#pl-pipe'), pipelineHTML(r, st, real, focus, !!P.focus));
    setHTML($('#pl-stage'), stagePanelHTML(r, st, real, focus, !!P.focus));

    // gap chip: playback is inside a compressed idle gap
    const E = r.events;
    const next = E[idx + 1];
    const inGap = next && next.compressed && v > E[idx].vt + 1e-6;
    const chip = $('#pl-gap');
    chip.classList.toggle('on', !!inGap);
    if (inGap) chip.textContent = `⋯ ${fmt(next.t - E[idx].t)} later`;

    const e = E[idx];
    setHTML($('#pl-status'), e
      ? `<span class="prov">${PROV[e.provider]}</span><b style="flex:none">${labelOf(r, e.stage)}</b><span style="color:var(--subtle)">›</span><span class="msg" title="${esc(e.msg)}">${esc(e.msg)}</span>`
      : '<span class="msg" style="color:var(--muted)">Waiting for the first event…</span>');

    const atEnd = !r.live && P.v >= r.total - 1e-6;
    const play = $('#pl-play');
    play.innerHTML = P.playing ? PAUSE : atEnd ? RESTART : PLAY;
    play.setAttribute('aria-label', P.playing ? 'Pause' : atEnd ? 'Replay from start' : 'Play');
    play.disabled = $('#pl-step').disabled = $('#pl-scrub').disabled = !!r.live;
    const scrub = $('#pl-scrub');
    scrub.max = r.total;
    scrub.style.visibility = r.live ? 'hidden' : '';
    if (document.activeElement !== scrub || r.live) scrub.value = Math.min(P.v, r.total);
    $('#pl-clock').textContent = r.live ? `${clock(real)} elapsed` : `${clock(real)} / ${clock(r.duration)}`;
    $$('#pl-speed button').forEach(b => { b.setAttribute('aria-checked', String(+b.dataset.speed === P.speed)); b.disabled = !!r.live; });

    const key = r.id + ':' + idx;
    if (key !== sideKey) { sideKey = key; paintSide(r, st); }
  }

  function paintSide(r, st) {
    const cfg = r.kind === 'config';
    const pub = cfg || st.publish.state === 'succeeded', git = st.gitops.state === 'succeeded';
    const awaiting = s => `<span class="await">awaiting ${s}</span>`;
    const rec = st.reconcile, ro = st.rollout, ve = st.verify;
    const argo = { succeeded: `Synced · <span class="mono">${r.gitops}</span>`, running: 'Syncing…', unknown: '<span style="color:var(--unk)">No sync evidence</span>', failed: '<span style="color:var(--fail)">Sync failed</span>', skipped: '<span class="await">skipped</span>' }[rec.state] || awaiting('Reconcile');
    const roText = ro.state === 'skipped' ? '<span class="await">skipped</span>' : ro.last ? esc(ro.last.msg) : awaiting('Rollout');
    const passed = ve.samples.filter(x => x.ok).length;
    const dots = [0, 1, 2, 3, 4].map(i => `<span class="vd ${ve.samples[i] ? (ve.samples[i].ok ? 'ok' : 'bad') : ''}"></span>`).join('');
    const veText = ve.state === 'skipped' ? '<span class="await">skipped</span>'
      : ve.samples.length ? `<span class="vdots" aria-hidden="true">${dots}</span><span>${passed}/5 passing</span>` : awaiting('Verify');
    const copyBtn = val => `<button class="copy" data-copy="${esc(val)}" aria-label="Copy" title="Copy">${COPY}</button>`;

    $('#details').innerHTML = `
      <div class="field"><div class="k">Release ID</div><div class="v"><span class="mono">${esc(r.id)}</span>${copyBtn(r.id)}</div></div>
      <div class="field"><div class="k">Service</div><div class="v">${releaseTitle(r)} <span style="color:var(--subtle);font-weight:400">· ${r.env}</span></div></div>
      ${cfg
        ? `<div class="field"><div class="k">Commit</div><div class="v"><span class="mono">homelab-infra@${r.gitops}</span> <span style="color:var(--subtle);font-weight:400">by ${esc(r.author)}</span></div></div>
           <div class="field"><div class="k">Artifact digest</div><div class="v"><span class="mono">${shortDigest(r.digest)}</span> <span style="color:var(--subtle);font-weight:400">unchanged</span></div></div>
           <div class="field"><div class="k">Running app release</div><div class="v"><span class="mono">${esc(r.appId)}</span></div></div>`
        : `<div class="field"><div class="k">Source</div><div class="v"><a href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">${esc(r.repo.split('/')[1])}</a> <span class="mono">@${esc(r.sha)}</span></div></div>
           <div class="field"><div class="k">Artifact digest</div><div class="v">${pub ? `<span class="mono">${shortDigest(r.digest)}</span>${copyBtn(r.digest)}` : awaiting('Publish')}</div></div>
           <div class="field"><div class="k">GitOps commit</div><div class="v">${git ? `<span class="mono">homelab-infra@${r.gitops}</span>` : awaiting('GitOps')}</div></div>`}
      <div class="field"><div class="k">Argo CD</div><div class="v">${argo}</div></div>
      <div class="field"><div class="k">Rollout</div><div class="v" style="font-weight:400">${roText}</div></div>
      <div class="field"><div class="k">Verification</div><div class="v">${veText}</div></div>`;
  }

  function rowHTML(r) {
    const pos = r.live ? liveV(r) : r.total;
    const { st } = project(r, pos);
    const real = r.live ? pos : r.duration;
    const dur = r.live ? fmt(real) : fmt(r.duration);
    return `<div class="tr row ${r === P.rel ? 'sel' : ''}" role="row" data-id="${esc(r.id)}" tabindex="0" aria-label="${esc(r.id)}">
      <div class="c-rel"><div class="rel-l1">${releaseTitle(r)} <span class="mono" style="font-weight:500">${esc(shaOf(r))}</span></div>
        <div class="rel-l2">${r.kind === 'config' ? `by ${esc(r.author)}` : '#' + r.run} · ${r.scenario ? 'scenario: ' + esc(r.scenario) : '“' + esc(r.msg) + '”'}</div></div>
      <div class="c-pipe">${miniHTML(r, st, real)}</div>
      <div class="c-out">${outcomePill(st)}</div>
      <div class="c-start">${esc(relTime(r.start))}</div>
      <div class="c-dur">${dur}</div>
      <div class="c-act">${r.live
        ? `<button class="btn" data-watch="${esc(r.id)}">Watch</button>`
        : `<button class="btn" data-replay="${esc(r.id)}">${REPLAY_ICON}Replay</button>`}</div>
    </div>`;
  }

  function paintRows() {
    setHTML($('#recent'), RELEASES.slice(0, 6).map(rowHTML).join(''));
    const svc = $('#f-service').value, kind = $('#f-kind').value, out = $('#f-outcome').value, drills = $('#f-drills').checked;
    const list = RELEASES.filter(r => (!svc || r.service === svc) && (!kind || r.kind === kind) && (drills || !r.drill)
      && (!out || outcome(project(r, r.live ? liveV(r) : r.total).st) === out));
    setHTML($('#history'), list.length ? list.map(rowHTML).join('') : '<div class="empty">No releases match these filters.</div>');
  }

  function paintMetrics() {
    const recent = RELEASES.filter(r => !r.drill && NOW - r.start.getTime() < 7 * 86400e3);
    const week = recent.filter(r => r.kind === 'application');
    const configs = recent.length - week.length;
    const done = week.filter(r => !r.live);
    const verified = done.filter(r => r.final.verify.state === 'succeeded').length;
    const leads = RELEASES.filter(r => !r.drill && r.kind === 'application' && !r.live && outcome(r.final) === 'succeeded').map(r => r.duration).sort((a, b) => a - b);
    const median = leads.length ? (leads.length % 2 ? leads[(leads.length - 1) / 2] : (leads[leads.length / 2 - 1] + leads[leads.length / 2]) / 2) : 0;
    const live = RELEASES.filter(r => r.live);
    $('#metrics').innerHTML = `
      <div class="tile"><div class="k">In progress</div><div class="v">${live.length}</div><div class="sub">${live.length ? esc(live[0].service + ' ' + live[0].sha) : 'Idle · replaying latest'}</div></div>
      <div class="tile"><div class="k">Releases · 7d</div><div class="v">${week.length}</div><div class="sub" title="Application releases only; drills excluded">${verified} of ${done.length} verified · +${configs} config</div></div>
      <div class="tile"><div class="k">Ingestion</div><div class="v"><span class="pill o-succeeded" style="font-size:13.5px;padding:3px 10px">Healthy</span></div><div class="sub">queue depth 0 · dead-letter 0</div></div>
      <div class="tile"><div class="k">Median lead time</div><div class="v">${fmt(median)}</div><div class="sub">commit → verified · n = ${leads.length}</div></div>`;
  }

  /* ------------------------------------------------------------------ */
  /* Simulated event stream (fixture mode)                               */
  /* ------------------------------------------------------------------ */
  let toastTimer;
  function toast(html) {
    const t = $('#toast');
    t.innerHTML = html;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 4500);
  }

  // Rewrites a provider-time timeline into the order events reach mybuilds
  // live: job steps are not seen until GitHub's workflow_job "completed"
  // delivery, which reports them all at once with their own timestamps.
  const JOB_OF = { build: 'build', publish: 'build', gitops: 'bump-gitops' };
  function toArrival(r) {
    const out = [], jobs = {};
    for (const e of r.events) {
      const job = JOB_OF[e.stage];
      if (!job || !e.step) { out.push({ ...e }); continue; }
      const j = jobs[job] || (jobs[job] = { start: e.t, end: e.t, stage: e.stage, steps: new Map() });
      j.end = e.t;
      let p = j.steps.get(e.step);
      if (!p) j.steps.set(e.step, p = { stage: e.stage, step: e.step, start: e.t });
      if (e.ss !== 'running') Object.assign(p, { end: e.t, ss: e.ss, detail: e.detail });
      if (e.step === 'Send release.published' && e.ss === 'succeeded') {
        out.push({ t: e.t, stage: 'publish', state: 'succeeded', provider: 'ci', msg: `release.published · ${shortDigest(r.digest)}` });
        out.push({ t: e.t, stage: 'build', state: 'succeeded', provider: 'mybuilds', msg: 'Build complete · the published image proves the build finished' });
      }
      if (e.step === 'Send gitops.updated' && e.ss === 'succeeded')
        out.push({ t: e.t, stage: 'gitops', state: 'succeeded', provider: 'ci', msg: `gitops.updated · homelab-infra@${r.gitops}` });
    }
    for (const [name, j] of Object.entries(jobs)) {
      out.push({ t: j.start, stage: j.stage, state: 'running', provider: 'github', msg: `workflow_job ${name} · in_progress · runner ${r.runner}` });
      out.push({ t: j.end + 2, stage: j.stage, state: null, provider: 'github', msg: `workflow_job ${name} · completed · ${j.steps.size} steps reported`, batch: [...j.steps.values()] });
    }
    if (jobs['bump-gitops']) out.push({ t: jobs['bump-gitops'].end + 3, stage: 'source', state: null, provider: 'github', msg: 'workflow_run · completed · conclusion: success' });
    out.sort((a, b) => a.t - b.t);
    let prev = 0;
    return out.map(({ t, i, vt, compressed, ...rest }) => { const dt = t - prev; prev = t; return { ...rest, dt }; });
  }

  function spawnLive() {
    const r = mk(PS, { run: 64, sha: 'b81e07d', msg: 'Add mybuilds link to nav', start: new Date(), gen: 65, b: 16, p: 5, g: 4, aw: 8, sy: 5, ro: 4, vi: 4 }, full, false);
    r.providerSteps = r.steps;
    r.steps = toArrival(r);
    build(r, false);
    r.live = true;
    r.liveStart = performance.now();
    LIVE = r;
    RELEASES.unshift(r);
    toast(`<span class="tag tag-live">NEW</span><span><b>personal-site</b> <span class="mono">b81e07d</span> started deploying</span>`);
    if (!P.picked) load(r); else paintRows();
    paintMetrics();
  }

  function finishLive() {
    const r = LIVE;
    r.live = false;
    // Once recorded, the timeline is ordered by provider time, so a replay
    // shows each step when it actually ran.
    r.steps = r.providerSteps;
    build(r, true);
    LIVE = null;
    if (P.rel === r) { P.v = r.total; P.playing = false; }
    sideKey = '';
    dirty = true;
    paintRows();
    paintMetrics();
    toast(`${ICON.succeeded}<span><b>personal-site</b> <span class="mono">b81e07d</span> verified · now replayable</span>`);
  }

  /* ------------------------------------------------------------------ */
  /* Main loop                                                           */
  /* ------------------------------------------------------------------ */
  let last = 0, lastPaint = 0, lastRows = 0;
  function frame(ts) {
    const dt = last ? Math.min((ts - last) / 1000, 0.25) : 0;
    last = ts;
    if (LIVE && liveV(LIVE) >= LIVE.total) finishLive();
    if (P.rel && !P.rel.live && P.playing) {
      P.v += dt * P.speed;
      if (P.v >= P.rel.total) { P.v = P.rel.total; P.playing = false; dirty = true; }
    }
    const active = P.playing || (P.rel && P.rel.live);
    if (!held) {
      if (P.rel && (dirty || (active && ts - lastPaint > 66))) { paintPlayer(); lastPaint = ts; dirty = false; }
      if (LIVE && ts - lastRows > 500) { paintRows(); paintMetrics(); lastRows = ts; }
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /* Events                                                              */
  /* ------------------------------------------------------------------ */
  const byId = id => RELEASES.find(r => r.id === id);

  $('#pl-play').addEventListener('click', () => {
    const r = P.rel; if (r.live) return;
    if (!P.playing && P.v >= r.total - 1e-6) P.v = 0;
    P.playing = !P.playing; P.picked = true; dirty = true;
  });
  $('#pl-step').addEventListener('click', () => {
    const r = P.rel; if (r.live) return;
    const n = r.events.find(e => e.vt > P.v + 1e-6);
    P.v = n ? n.vt : r.total; P.playing = false; P.picked = true; dirty = true;
  });
  $('#pl-scrub').addEventListener('input', e => { P.v = +e.target.value; P.picked = true; dirty = true; });
  $('#pl-speed').addEventListener('click', e => { const b = e.target.closest('[data-speed]'); if (b && !b.disabled) { P.speed = +b.dataset.speed; dirty = true; } });

  function scrollToPlayer() {
    const p = $('#player'), r = p.getBoundingClientRect();
    if (r.top < 0 || r.top > innerHeight * 0.6) p.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }

  // Hold repaints while a pointer is down (except on the scrubber) so a
  // button can't be replaced between mousedown and mouseup.
  let held = false;
  document.addEventListener('pointerdown', e => { if (!e.target.closest('input[type=range]')) held = true; });
  const release = () => setTimeout(() => { held = false; }, 0);
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);

  document.addEventListener('click', e => {
    const stageBtn = e.target.closest('[data-stage]');
    if (stageBtn) {
      const k = stageBtn.dataset.stage;
      P.focus = P.focus === k ? null : k;
      dirty = true;
      return;
    }
    if (e.target.closest('[data-follow]')) { P.focus = null; dirty = true; return; }
    const rep = e.target.closest('[data-replay]');
    const watch = e.target.closest('[data-watch]');
    const copy = e.target.closest('[data-copy]');
    const goto = e.target.closest('[data-goto]');
    const row = e.target.closest('.row');
    if (copy) {
      try { navigator.clipboard.writeText(copy.dataset.copy).then(() => toast(`${ICON.succeeded}<span>Copied to clipboard</span>`), () => {}); } catch (_) {}
      return;
    }
    if (goto) { show(goto.dataset.goto); return; }
    if (rep) { P.picked = true; load(byId(rep.dataset.replay), { play: !reduced }); show('pipelines'); scrollToPlayer(); return; }
    if (watch) { P.picked = true; load(byId(watch.dataset.watch)); show('pipelines'); scrollToPlayer(); return; }
    if (row) { P.picked = true; const r = byId(row.dataset.id); load(r, { atEnd: true }); if ($('#view-history').hidden === false) { show('pipelines'); scrollToPlayer(); } }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('row')) e.target.click();
  });

  ['#f-service', '#f-kind', '#f-outcome', '#f-drills'].forEach(s => $(s).addEventListener('change', paintRows));

  // tabs
  const CRUMB = { pipelines: 'Pipelines', history: 'History' };
  function show(view) {
    $$('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
    for (const k of Object.keys(CRUMB)) $('#view-' + k).hidden = k !== view;
    $('#crumb').textContent = CRUMB[view];
    try { if (location.hash.slice(1) !== view) history.replaceState(null, '', view === 'pipelines' ? location.pathname : '#' + view); } catch (_) {}
  }
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) show(b.dataset.view); });

  // theme
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    $$('#theme button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeOpt === t)));
    if (persist) { try { localStorage.setItem('mybuilds-theme', t); } catch (_) {} }
  }
  $('#theme').addEventListener('click', e => { const b = e.target.closest('[data-theme-opt]'); if (b) applyTheme(b.dataset.themeOpt, true); });
  // With no saved choice, start from the OS preference without storing it.
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('mybuilds-theme'); } catch (_) {}
  applyTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */
  paintMetrics();
  // Idle homepage: autoplay the most recent release once (off with reduced motion).
  load(RELEASES[0], { play: !reduced, atEnd: reduced });
  const initial = location.hash.slice(1);
  show(CRUMB[initial] ? initial : 'pipelines');
  requestAnimationFrame(frame);
  setTimeout(spawnLive, 14000);
})();
</script>
</body>
</html>
